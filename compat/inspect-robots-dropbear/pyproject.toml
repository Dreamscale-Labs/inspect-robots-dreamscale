[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

# Compatibility release only. The adapter is now inspect-robots-dreamscale; this
# keeps `pip install -U inspect-robots-dropbear`, `import inspect_robots_dropbear`,
# `import dropbear`, the `dropbear` command and `--policy dropbear` working.
# It registers no entry point of its own: inspect-robots-dreamscale registers
# both `dreamscale` and the `dropbear` alias.
[project]
name = "inspect-robots-dropbear"
version = "0.1.18"
description = "Renamed to inspect-robots-dreamscale. Installs it and keeps the old names working."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "inspect-robots-dreamscale==0.1.18",
  # The SDK's own compatibility release: keeps `import dropbear` and the
  # `dropbear` command working on top of the dreamscale SDK.
  "dropbear[dreamzero]==0.1.0a24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_dropbear"]
