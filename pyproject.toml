[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-dreamscale"
version = "0.2.0"
description = "Inspect Robots policy adapter for Dreamscale-hosted DreamZero-YAM"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  # Kept exact: the adapter reads the pinned SDK's session record to report
  # warm reclaims, and a26 is the newest release.
  "dreamscale[dreamzero]==0.1.0a26",
  # Tested against 0.53.1 (the qualified rig composition), 0.58.0 and 0.59.0.
  # 0.60 is excluded until it has been run through the same matrix.
  "inspect-robots>=0.53.1,<0.60",
  "numpy>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/Dreamscale-Labs/inspect-robots-dreamscale"
Documentation = "https://docs.dreamscalelabs.com/guides/inspect-robots"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.11"]

[project.entry-points."inspect_robots.policies"]
dreamscale = "inspect_robots_dreamscale:dreamscale_policy"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_dreamscale"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
